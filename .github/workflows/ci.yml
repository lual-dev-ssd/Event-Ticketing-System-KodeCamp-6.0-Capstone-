name: FastAPI GitHub Actions CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with Flake8
        run: |
          # Stop build if there are syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat remaining issues as warnings (max line length 120)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/event_db_test
          SECRET_KEY: test_secret_key_for_jwt_auth
          ALGORITHM: HS256
          MOMO_SUBSCRIPTION_KEY: test_subscription_key
          MOMO_API_USER: 00000000-0000-0000-0000-000000000000
          MOMO_API_KEY: test_api_key
          MOMO_ENVIRONMENT: sandbox
          MOMO_BASE_URL: https://sandbox.momodevelopment.mtn.com
          PUBLIC_URL: http://localhost:8000
        run: |
          pytest --cov=app --cov-report=term-missing